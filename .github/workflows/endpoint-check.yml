name: RSEB endpoint check

on:
  schedule:
    - cron: "15 0 * * *"   # every day at 00:15 UTC (06:15 Bhutan time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python check_endpoints.py
