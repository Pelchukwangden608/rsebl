name: Keep API awake

# Render's free plan sleeps a web service after about 15 minutes without traffic.
# This pings the API every 10 minutes so the collector keeps running and the dashboard loads at once.
# Set the repository variable RSEBL_API_URL to the API address, for example https://your-service.onrender.com

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.RSEBL_API_URL }}
        run: |
          test -n "$API_URL" || { echo "Set the RSEBL_API_URL repository variable"; exit 1; }
          curl -fsS --max-time 60 "$API_URL/health"
